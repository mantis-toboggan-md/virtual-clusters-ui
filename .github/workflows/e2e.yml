name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CATTLE_BOOTSTRAP_PASSWORD: password
  TEST_BASE_URL: https://127.0.0.1.sslip.io
  EXTENSION_SERVER_PORT: "8080"

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Resolve Rancher versions for this branch
        id: resolve
        run: |
          BRANCH="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          MATRIX=$(jq -c --arg branch "$BRANCH" '.[$branch] // error("no rancher-versions.json entry for branch \($branch)")' rancher-versions.json)
          echo "Testing against: ${MATRIX}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each row installs its own k3s + k3d on its own runner, so rows are
      # independent - capped to leave runner headroom for other workflows.
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    name: "Rancher ${{ matrix.chartVersionPrefix }}"
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Start Rancher (Prime alpha, Helm on k3s)
        env:
          CHART_VERSION_PREFIX: ${{ matrix.chartVersionPrefix }}
          KUBE_VERSION: ${{ matrix.kubeVersion }}
        run: ./scripts/e2e-k3s-start.sh

      - name: Bootstrap Rancher
        run: ./scripts/e2e-bootstrap-rancher.sh

      - name: Import a k3d cluster as a generic cluster
        run: ./scripts/e2e-import-generic-cluster.sh

      - name: Build, serve, and register the extension
        run: ./scripts/e2e-create-uiplugin.sh

      - name: Run Cypress
        env:
          TEST_USERNAME: admin
        run: yarn e2e:ci

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-artifacts-${{ matrix.chartVersionPrefix }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
