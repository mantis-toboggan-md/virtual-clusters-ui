name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rancher_version:
        description: "Test a specific Rancher minor line only (e.g. 2.15). Leave empty for the full matrix."
        required: false
        type: string
        default: ""

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Neither job calls the GitHub API or pushes anything - explicit least-privilege
# regardless of the org/repo default token permissions.
permissions:
  contents: read

env:
  CATTLE_BOOTSTRAP_PASSWORD: password
  EXTENSION_SERVER_PORT: "8080"

jobs:
  resolve-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Resolve Rancher versions for this branch
        id: resolve
        env:
          RANCHER_VERSION_INPUT: ${{ github.event.inputs.rancher_version }}
        run: |
          BRANCH="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          # workflow_dispatch's rancher_version input narrows the matrix to a single
          # row, so a fix can be iterated on without paying for the full matrix every time.
          VERSIONS=$(jq -c --arg branch "$BRANCH" --arg version "$RANCHER_VERSION_INPUT" '
            (.[$branch] // error("no rancher-versions.json entry for branch \($branch)")) as $all
            | if $version != "" then ($all | map(select(.chartVersionPrefix == $version))) else $all end
          ' rancher-versions.json)

          if [ "$(echo "$VERSIONS" | jq 'length')" = "0" ]; then
            echo "::error::rancher_version '${RANCHER_VERSION_INPUT}' has no entry in rancher-versions.json for branch '${BRANCH}'"
            exit 1
          fi

          # Create cartesian product of versions × roles
          MATRIX=$(echo "$VERSIONS" | jq -c '
            . as $versions
            | [
              { username: "admin", tag: "@adminUser" },
              { username: "standard_user", tag: "@standardUser" }
            ] as $roles
            | [$versions[] as $v | $roles[] as $r | ($v + $r)]
          ')

          echo "Testing against: ${MATRIX}"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Each row installs its own k3s + k3d on its own runner, so rows are
      # independent - capped to leave runner headroom for other workflows.
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    name: "Rancher ${{ matrix.chartVersionPrefix }} / ${{ matrix.tag }}"
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Resolve a Rancher URL reachable from k3d's containers
        run: |
          # k3s (hosting Rancher) runs natively on this runner, but the k3d
          # cluster imported later runs as containers on Docker's bridge
          # network. From inside those containers, 127.0.0.1 means the
          # container itself, not this host, so the cluster-agent could
          # never dial back to Rancher and the import would hang in
          # "pending" forever. The bridge gateway IP is reachable from both
          # the host and from containers on that bridge, so route
          # TEST_BASE_URL through it instead of a loopback address.
          HOST_IP=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          echo "Routing TEST_BASE_URL through the Docker bridge gateway: ${HOST_IP}"
          echo "TEST_BASE_URL=https://${HOST_IP}.sslip.io" >> "$GITHUB_ENV"

      - name: Start Rancher (Prime alpha, Helm on k3s)
        env:
          CHART_VERSION_PREFIX: ${{ matrix.chartVersionPrefix }}
          KUBE_VERSION: ${{ matrix.kubeVersion }}
        run: ./scripts/e2e-k3s-start.sh

      - name: Bootstrap Rancher
        run: ./scripts/e2e-bootstrap-rancher.sh

      - name: Import a k3d cluster as a generic cluster
        run: ./scripts/e2e-import-generic-cluster.sh

      - name: Build, serve, and register the extension
        run: ./scripts/e2e-create-uiplugin.sh

      - name: Run Cypress
        env:
          TEST_USERNAME: ${{ matrix.username }}
          GREP_TAGS: ${{ matrix.tag }}
        run: yarn e2e:ci

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-artifacts-${{ matrix.chartVersionPrefix }}-${{ matrix.tag }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
